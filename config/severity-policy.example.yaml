# Company severity policy. Copy, edit, and set severityPolicyFile.
# matrix[sloStatus][tier] = SEV number (1 = worst).
matrix:
  breached: {enterprise: 1, business: 2, starter: 3, unknown: 2}
  at_risk:  {enterprise: 2, business: 3, starter: 4, unknown: 3}
  timeout:  {enterprise: 3, business: 4, starter: 4, unknown: 4}
  no_data:  {enterprise: 3, business: 4, starter: 4, unknown: 4}
multiTenantEscalation: 3      # +1 level when >= 3 tenants affected (0 = off)
autoDeclare:
  enabled: true
  maxSeverity: 2              # SEV1/SEV2 auto-declare; others are proposed
  consecutiveEvaluations: 2   # status must persist this many SLO evaluations
  requireKnownTier: true
  neverFor: [timeout, no_data]
