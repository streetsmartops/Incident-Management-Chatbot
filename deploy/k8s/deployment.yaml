apiVersion: v1
kind: ConfigMap
metadata:
  name: incidentd-config
  namespace: incidentd
data:
  config.yaml: |
    # Copy config/example.yaml here and fill in non-secret settings.
    server: {listen: ":8080", metricsListen: ":9090"}
    database: {driver: postgres, schema: incident_bot}
    slack: {enabled: true, announceChannelId: ""}
    remediation: {catalogDir: /app/remediation/catalog}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentd
  namespace: incidentd
spec:
  replicas: 2
  selector:
    matchLabels: {app: incidentd}
  template:
    metadata:
      labels: {app: incidentd}
      annotations:
        # Prometheus (annotation-based scraping). Prometheus Operator users:
        # apply deploy/monitoring/servicemonitor.yaml instead.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
        # Datadog Agent OpenMetrics check (generated from
        # deploy/dashboards/datadog/openmetrics-mapping.json).
        ad.datadoghq.com/incidentd.checks: '{"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:9090/metrics","namespace":"incidentd","metrics":[{"incidentd_action_requests":"action_requests"},{"incidentd_build_info":"build_info"},{"incidentd_commands":"commands"},{"incidentd_http_request_duration_seconds":"http_request_duration_seconds"},{"incidentd_http_requests":"http_requests"},{"incidentd_incident_duration_seconds":"incident_duration_seconds"},{"incidentd_incident_transitions":"incident_transitions"},{"incidentd_incidents_declared":"incidents_declared"},{"incidentd_incidents_open":"incidents_open"},{"incidentd_interactions":"interactions"},{"incidentd_llm_tokens":"llm_tokens"},{"incidentd_remediation_executor_enabled":"remediation_executor_enabled"},{"incidentd_side_effect_failures":"side_effect_failures"},{"incidentd_signals":"signals"},{"incidentd_slo_polls":"slo_polls"},{"incidentd_timeline_conflicts":"timeline_conflicts"},{"incidentd_triage_dropped":"triage_dropped"},{"incidentd_triage_duration_seconds":"triage_duration_seconds"},{"incidentd_triage_runs":"triage_runs"},{"incidentd_triage_tool_calls":"triage_tool_calls"}]}]}}'
    spec:
      serviceAccountName: incidentd
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: incidentd
          image: ghcr.io/streetsmartops/incidentd:latest # pin a digest in production
          args: ["serve", "-config", "/etc/incidentd/config.yaml"]
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9090, name: metrics}
          env:
            # Each secret is read from a mounted file (NAME_FILE).
            - {name: DATABASE_URL_FILE, value: /etc/incidentd/secrets/DATABASE_URL}
            - {name: SLACK_BOT_TOKEN_FILE, value: /etc/incidentd/secrets/SLACK_BOT_TOKEN}
            - {name: SLACK_SIGNING_SECRET_FILE, value: /etc/incidentd/secrets/SLACK_SIGNING_SECRET}
            - {name: PAGERDUTY_API_TOKEN_FILE, value: /etc/incidentd/secrets/PAGERDUTY_API_TOKEN}
            - {name: PAGERDUTY_WEBHOOK_SECRET_FILE, value: /etc/incidentd/secrets/PAGERDUTY_WEBHOOK_SECRET}
            - {name: DATADOG_API_KEY_FILE, value: /etc/incidentd/secrets/DATADOG_API_KEY}
            - {name: DATADOG_APP_KEY_FILE, value: /etc/incidentd/secrets/DATADOG_APP_KEY}
            - {name: JIRA_API_TOKEN_FILE, value: /etc/incidentd/secrets/JIRA_API_TOKEN}
            - {name: MULTIPLEXER_TOKEN_FILE, value: /etc/incidentd/secrets/MULTIPLEXER_TOKEN}
            - {name: ANTHROPIC_API_KEY_FILE, value: /etc/incidentd/secrets/ANTHROPIC_API_KEY}
            - {name: TEAMS_APP_PASSWORD_FILE, value: /etc/incidentd/secrets/TEAMS_APP_PASSWORD}
            - {name: INCIDENTD_ADMIN_TOKEN_FILE, value: /etc/incidentd/secrets/INCIDENTD_ADMIN_TOKEN}
            # Env half of the remediation kill switch. Keep "false" until the
            # triage eval gate passes (docs/architecture.md §11).
            - {name: REMEDIATION_ENABLED, value: "false"}
          volumeMounts:
            - {name: config, mountPath: /etc/incidentd, readOnly: true}
            - {name: secrets, mountPath: /etc/incidentd/secrets, readOnly: true}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - name: config
          configMap: {name: incidentd-config}
        - name: secrets
          secret: {secretName: incidentd-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: incidentd
  namespace: incidentd
spec:
  selector: {app: incidentd}
  ports: [{port: 80, targetPort: http, name: http}]
---
# Internal-only Service for metrics. Do not route it through the ingress.
apiVersion: v1
kind: Service
metadata:
  name: incidentd-metrics
  namespace: incidentd
  labels: {app: incidentd}
spec:
  selector: {app: incidentd}
  ports: [{port: 9090, targetPort: metrics, name: metrics}]
