# Slack app manifest. Replace https://incidentd.example.com with your public URL.
display_information:
  name: Incident Bot
  description: Declare, coordinate, triage and learn from incidents.
features:
  bot_user:
    display_name: incidentbot
    always_online: true
  slash_commands:
    - command: /incident
      url: https://incidentd.example.com/slack/commands
      description: Incident commands (declare, sev, role, status, update, triage, run, resolve, postmortem, timeline)
      usage_hint: declare "<title>" --sev 2
      should_escape: true   # mentions arrive as <@U123|name>
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - channels:manage
      - groups:write
      - channels:write.invites
      - channels:write.topic
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://incidentd.example.com/slack/interactivity
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
